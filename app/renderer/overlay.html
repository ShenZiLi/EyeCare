<!doctype html>
<html lang="zh-CN" data-surface="overlay">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self' ws:"/>
  <title>EyeCare</title>
  <!-- The native window can expose this document before renderer initialization. -->
  <style>
    html[data-surface="overlay"], html[data-surface="overlay"] body, html[data-surface="overlay"] #root {
      background: transparent !important;
      color-scheme: normal !important;
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body data-surface="overlay"><div id="root"></div><script type="module" src="/overlay-main.tsx"></script></body>
</html>
