[package]
name = "eyecare"
version = "1.0.4"
description = "跨平台常驻护眼提醒工具"
authors = ["EyeCare contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "eyecare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }
